name: Enterprise CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  code-quality-and-lint:
    name: Code Formatting, Linting & Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: |
          pip install ruff

      - name: Enforce Ruff Formatting
        run: |
          ruff format --check .

      - name: Enforce Ruff Linter Rules
        run: |
          ruff check .

      - name: Enforce Strict 88-Column Line Width
        run: |
          python3 ci/check_line_length.py

  security-and-architecture:
    name: AST Security, Quality & Release Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=src" >> $GITHUB_ENV

      - name: Validate Release Notes Schema (RN.json)
        run: |
          python3 ci/validate_release_notes.py

      - name: Run AST Security & Quality Review Agent
        run: |
          python3 -m ai_pair_programming.tools.code_review_agent

  test-suite:
    name: Modular Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Master Unit Test Suite
        run: |
          python3 test_suite.py
